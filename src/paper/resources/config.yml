world:
  name: fae_realm
  display-name: Fae Realm
  # 0 = let Bukkit choose the seed. Set a number for reproducible realms.
  seed: 0
  spawn-y: 136

  # What happens when a player falls beneath the floating islands:
  # return-to-overworld | fae-spawn | death
  void-behavior: return-to-overworld

  # Realm gameplay rules. These can be reloaded without regenerating terrain.
  pvp: true
  daylight-cycle: true
  weather-cycle: true
  mob-spawning: true

portal:
  enabled: true
  auto-activate: true
  cooldown-seconds: 3

# The deterministic generator revision is owned by the plugin code and recorded in
# fae-realm-generator.yml. It is intentionally not a user-editable setting.
worldgen:
  # balanced | ethereal | lush | wild
  # Presets provide sensible terrain personalities. The values below can override
  # the preset defaults individually.
  preset: balanced

  # 1.0 is the intended default. Valid range is clamped to 0.25 - 1.75.
  island-density: 1.0

  # Vertical relief multiplier. Valid range: 0.50 - 1.80.
  vertical-scale: 1.0

  # Higher values produce more internal island caverns. Valid range: 0.20 - 1.80.
  cave-density: 1.0

  # Enable deterministic island personalities: balanced, plateau, spire,
  # terraced, and hollow. Turning this off makes generated islands use the
  # balanced profile only.
  terrain-profiles: true

  # Decorative cloud shelf Y level. Valid range is clamped to 48 - 120.
  cloud-level: 74

  # Density multipliers for generated details. 0 disables that density layer;
  # values up to 2.5 are supported. The layer toggle below can still disable it.
  decoration-density: 1.0
  resource-density: 1.0

  # One major structure candidate is chosen per square cell of this many chunks.
  # Valid range: 6 - 24. Lower values make structures more common.
  structure-spacing-chunks: 10

  # Chance that a valid major-structure site becomes a Fae Vault instead of its
  # region-specific landmark. Valid range: 0.0 - 0.50.
  dungeon-chance: 0.12

  # Independent generator layers. Changing these affects newly generated chunks.
  clouds: true
  decorations: true
  structures: true
  resources: true

  # Existing chunks are never rewritten automatically.
  regenerate-unexplored-chunks-only: true

progression:
  enabled: true
  # Chance for a Fae-generated ore/resource block to release Fae Essence when mined.
  essence-drop-chance: 0.22

integrations:
  betterstructures:
    # Keep generic BetterStructures packs out of Fae Realm by default.
    # A dedicated Fae Realm structure pack can opt in later.
    allow-generic-structures-in-fae-realm: false

messages:
  prefix: '<light_purple>[Fae Realm]</light_purple> '
