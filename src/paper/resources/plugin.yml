name: TheFaeRealm
version: '${version}'
main: com.wickidcow.aetherlegacy.paper.AetherLegacyPlugin
description: Server-side Paper fantasy world generator, structures, dungeons, resources, and portal plugin for the Fae Realm.
authors: [wickidcow]
contributors: [The Aether Team]
website: https://github.com/wickidcow/The-Fae-Realm
api-version: '26.2'
load: POSTWORLD
# The generator must be enabled before Multiverse-Core so an existing/imported
# fae_realm keeps TheFaeRealm as its generator across restarts.
loadbefore: [Multiverse-Core]
softdepend: [BetterStructures]
commands:
  fae:
    aliases: [faerealm, aether]
    description: Travel to, inspect, or administer the Fae Realm.
    usage: /fae [return|info|biome|locate|reload|help]
    permission: faerealm.command
permissions:
  faerealm.command:
    description: Allows travel to and inspection of the Fae Realm.
    default: true
  faerealm.admin:
    description: Allows administrative Fae Realm commands and region diagnostics.
    default: op
  aetherlegacy.command:
    description: Legacy compatibility permission for early development builds.
    default: true
  aetherlegacy.admin:
    description: Legacy compatibility permission for early development builds.
    default: op
