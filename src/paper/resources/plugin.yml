name: AetherLegacyPaper
version: '${version}'
main: com.wickidcow.aetherlegacy.paper.AetherLegacyPlugin
description: Server-side Paper world generator and portal plugin for the Fae Realm.
authors: [wickidcow]
contributors: [The Aether Team]
website: https://github.com/wickidcow/The-Aether
api-version: '26.2'
load: POSTWORLD
commands:
  aether:
    aliases: [fae, faerealm]
    description: Travel to or inspect the Fae Realm.
    usage: /aether [return|info|reload]
    permission: aetherlegacy.command
permissions:
  aetherlegacy.command:
    description: Allows travel to the Fae Realm.
    default: true
  aetherlegacy.admin:
    description: Allows administrative Aether Legacy commands.
    default: op
