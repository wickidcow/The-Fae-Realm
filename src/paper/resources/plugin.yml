name: TheFaeRealm
version: '${version}'
main: com.wickidcow.aetherlegacy.paper.AetherLegacyPlugin
description: Server-side Paper fantasy world generator, structures, dungeons, resources, and portal plugin for the Fae Realm.
authors: [wickidcow]
contributors: [The Aether Team]
website: https://github.com/wickidcow/The-Fae-Realm
api-version: '26.2'
load: POSTWORLD
softdepend: [BetterStructures]
commands:
  fae:
    aliases: [faerealm, aether]
    description: Travel to or inspect the Fae Realm.
    usage: /fae [return|info|reload]
    permission: faerealm.command
permissions:
  faerealm.command:
    description: Allows travel to the Fae Realm.
    default: true
  faerealm.admin:
    description: Allows administrative Fae Realm commands.
    default: op
  aetherlegacy.command:
    description: Legacy compatibility permission for early development builds.
    default: true
  aetherlegacy.admin:
    description: Legacy compatibility permission for early development builds.
    default: op
