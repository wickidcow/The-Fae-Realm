name: AetherLegacyPaper
version: '${version}'
main: com.wickidcow.aetherlegacy.paper.AetherLegacyPlugin
description: Server-side Paper port foundation for an Aether-style dimension.
authors: [wickidcow]
contributors: [The Aether Team]
website: https://github.com/wickidcow/The-Aether
api-version: '26.2'
load: POSTWORLD
commands:
  aether:
    description: Travel to or inspect the Aether Legacy world.
    usage: /aether [return|info|reload]
    permission: aetherlegacy.command
permissions:
  aetherlegacy.command:
    description: Allows use of the Aether command.
    default: true
  aetherlegacy.admin:
    description: Allows administrative Aether Legacy commands.
    default: op
