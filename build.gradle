plugins {
    id 'java'
}

group = 'com.wickidcow.faerealm'
version = '0.4.0'

def paperVersion = findProperty('paper_version') ?: '26.3.build.+'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperVersion}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

sourceSets {
    main {
        java.srcDirs = ['src/paper/java']
        resources.srcDirs = ['src/paper/resources']
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

jar {
    archiveBaseName = 'TheFaeRealm'
    archiveVersion = project.version
    manifest {
        attributes(
            'Implementation-Title': 'The Fae Realm',
            'Implementation-Version': project.version,
            'Built-For': 'Paper 26.3 primary / 1.21.11+ compatibility / Java 25'
        )
    }
}

tasks.named('build') {
    dependsOn tasks.named('jar')
}
