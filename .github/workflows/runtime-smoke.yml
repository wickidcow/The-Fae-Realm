name: Paper Compatibility Runtime Smoke

on:
  push:
    branches:
      - paper-26.3
    paths:
      - 'src/paper/**'
      - 'scripts/paper_runtime_smoke.sh'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - '.github/workflows/runtime-smoke.yml'
  pull_request:
    branches:
      - paper-26.3
    paths:
      - 'src/paper/**'
      - 'scripts/paper_runtime_smoke.sh'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - '.github/workflows/runtime-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fae-realm-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PAPER_DOWNLOAD_USER_AGENT: "The-Fae-Realm-CI/0.4.0 (https://github.com/wickidcow/The-Fae-Realm)"

jobs:
  paper-runtime-smoke:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21.11'
            channel: 'STABLE'
            label: 'Boot twice on Paper 1.21.11 compatibility floor'
          - minecraft: '26.3'
            channel: 'AUTO'
            label: 'Boot twice on primary Paper 26.3'

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build The Fae Realm JAR against Paper 26.3
        run: |
          chmod +x gradlew scripts/paper_runtime_smoke.sh
          ./gradlew --no-daemon clean build

      - name: Locate candidate JAR
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -name 'TheFaeRealm-*.jar' -print -quit)"
          test -n "$JAR"
          test -s "$JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Runtime compatibility smoke
        env:
          PAPER_MINECRAFT_VERSION: ${{ matrix.minecraft }}
          PAPER_CHANNEL: ${{ matrix.channel }}
        run: bash scripts/paper_runtime_smoke.sh "${{ steps.candidate.outputs.jar }}"

      - name: Publish runtime smoke summary
        if: always()
        run: |
          if [[ -f build/paper-runtime-smoke/smoke-result.txt ]]; then
            {
              echo "## The Fae Realm — Paper ${{ matrix.minecraft }} runtime smoke"
              echo
              echo '```text'
              cat build/paper-runtime-smoke/smoke-result.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f build/paper-runtime-smoke/paper-build.txt ]]; then
            {
              echo
              echo '### Paper build'
              echo
              echo '```text'
              cat build/paper-runtime-smoke/paper-build.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f build/paper-runtime-smoke/first.console.log ]]; then
            {
              echo
              echo '### First boot tail'
              echo
              echo '```text'
              tail -n 80 build/paper-runtime-smoke/first.console.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f build/paper-runtime-smoke/second.console.log ]]; then
            {
              echo
              echo '### Second boot tail'
              echo
              echo '```text'
              tail -n 80 build/paper-runtime-smoke/second.console.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
