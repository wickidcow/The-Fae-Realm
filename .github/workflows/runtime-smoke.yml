name: Paper 26.2 Runtime Smoke

on:
  push:
    branches:
      - paper-26.2
    paths:
      - 'src/paper/**'
      - 'scripts/paper_runtime_smoke.sh'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - '.github/workflows/runtime-smoke.yml'
  pull_request:
    branches:
      - paper-26.2
    paths:
      - 'src/paper/**'
      - 'scripts/paper_runtime_smoke.sh'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - '.github/workflows/runtime-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fae-realm-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PAPER_MINECRAFT_VERSION: "26.2"
  PAPER_DOWNLOAD_USER_AGENT: "The-Fae-Realm-CI/0.1.0-SNAPSHOT (https://github.com/wickidcow/The-Fae-Realm)"

jobs:
  paper-runtime-smoke:
    name: Boot The Fae Realm twice on stable Paper 26.2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build The Fae Realm JAR
        run: |
          chmod +x gradlew scripts/paper_runtime_smoke.sh
          ./gradlew --no-daemon clean build

      - name: Locate candidate JAR
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -name 'TheFaeRealm-*.jar' -print -quit)"
          test -n "$JAR"
          test -s "$JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Boot-test stable Paper 26.2 twice
        run: bash scripts/paper_runtime_smoke.sh "${{ steps.candidate.outputs.jar }}"

      - name: Publish runtime smoke summary
        if: always()
        run: |
          if [[ -f build/paper-runtime-smoke/smoke-result.txt ]]; then
            {
              echo '## The Fae Realm — Paper 26.2 runtime smoke'
              echo
              echo '```text'
              cat build/paper-runtime-smoke/smoke-result.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f build/paper-runtime-smoke/paper-build.txt ]]; then
            {
              echo
              echo '### Paper build'
              echo
              echo '```text'
              cat build/paper-runtime-smoke/paper-build.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f build/paper-runtime-smoke/first.console.log ]]; then
            {
              echo
              echo '### First boot tail'
              echo
              echo '```text'
              tail -n 80 build/paper-runtime-smoke/first.console.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f build/paper-runtime-smoke/second.console.log ]]; then
            {
              echo
              echo '### Second boot tail'
              echo
              echo '```text'
              tail -n 80 build/paper-runtime-smoke/second.console.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
