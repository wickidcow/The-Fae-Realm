name: Build Aether Legacy for Paper

on:
  push:
    branches:
      - paper-26.2
  pull_request:
    branches:
      - paper-26.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Paper 26.2 / Java 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Paper plugin
        run: ./gradlew --no-daemon clean build

      - name: Verify JAR contents
        run: |
          test -f build/libs/AetherLegacyPaper-0.1.0-SNAPSHOT.jar
          jar tf build/libs/AetherLegacyPaper-0.1.0-SNAPSHOT.jar | grep -q 'plugin.yml'
          jar tf build/libs/AetherLegacyPaper-0.1.0-SNAPSHOT.jar | grep -q 'com/wickidcow/aetherlegacy/paper/AetherLegacyPlugin.class'
