name: Build The Fae Realm

on:
  push:
    branches:
      - paper-26.3
  pull_request:
    branches:
      - paper-26.3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fae-realm-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Paper 26.3 primary / 1.21.11+ compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile against Paper 1.21.11 compatibility floor
        run: ./gradlew --no-daemon clean compileJava -Ppaper_version=1.21.11-R0.1-SNAPSHOT

      - name: Build against primary Paper 26.3 API
        run: ./gradlew --no-daemon clean build

      - name: Locate and verify JAR contents
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -name 'TheFaeRealm-*.jar' -print -quit)"
          test -n "$JAR"
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'plugin.yml'
          jar tf "$JAR" | grep -q 'com/wickidcow/aetherlegacy/paper/AetherLegacyPlugin.class'
          jar tf "$JAR" | grep -q 'com/wickidcow/aetherlegacy/paper/world/FaeRealmPopulator.class'
          jar tf "$JAR" | grep -q 'com/wickidcow/aetherlegacy/paper/world/FaeDungeonGenerator.class'
          jar tf "$JAR" | grep -q 'com/wickidcow/aetherlegacy/paper/loot/FaeDungeonLootListener.class'
          unzip -p "$JAR" plugin.yml | grep -Fq "api-version: '1.21.11'"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: TheFaeRealm-26.3-compatible-raw-jar
          path: ${{ steps.candidate.outputs.jar }}
          archive: false
          if-no-files-found: error

      - name: Publish artifact summary
        run: |
          {
            echo '# 🧚 The Fae Realm — Raw JAR'
            echo
            echo '✅ Primary Paper 26.3 build passed.'
            echo '✅ Source also compiles against the Paper 1.21.11 compatibility floor.'
            echo
            echo "Artifact file: **${{ steps.candidate.outputs.jar_name }}**"
            echo
            echo 'The same JAR is runtime-tested separately on Paper 1.21.11 and Paper 26.3.'
          } >> "$GITHUB_STEP_SUMMARY"
